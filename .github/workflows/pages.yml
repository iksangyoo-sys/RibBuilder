# main에 올라온 원본(src/)을 빌드해서 GitHub Pages(https://iksangyoo-sys.github.io/RibBuilder/)에 올린다.
# PR에서는 테스트와 빌드만 확인한다.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 저장소의 ribbon-editor.html(더블클릭용)이 소스와 같은지 확인한다. 다르면 npm run build 후 복사해 커밋하세요.
      - name: Check ribbon-editor.html is up to date
        run: cmp dist/index.html ribbon-editor.html || (echo "::error::ribbon-editor.html이 소스와 다릅니다. npm run build 후 dist/index.html을 ribbon-editor.html로 복사해 커밋하세요." && exit 1)
      # 예전 주소(…/RibBuilder/ribbon-editor.html)도 계속 열리게 한다.
      - run: cp dist/index.html dist/ribbon-editor.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
